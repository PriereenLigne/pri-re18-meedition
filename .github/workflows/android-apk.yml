# Construit l'APK Android « Prière en Ligne » (site + Formation Héros de la foi + Défis bibliques, hors connexion)
# et le publie dans les Releases du dépôt.
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Site Prière en Ligne
        uses: actions/checkout@v4
        with:
          path: site

      - name: Défis bibliques (bible-challenge)
        uses: actions/checkout@v4
        with:
          repository: PriereenLigne/bible-challenge
          path: bible

      - name: Formation Héros de la foi
        uses: actions/checkout@v4
        with:
          repository: melchipasteur-ops/heros-de-la-foi
          path: heros

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Préparer le contenu hors connexion
        run: node site/android/prepare-web.mjs --site site --heros heros --bible bible --out site/android/app/src/main/assets/www

      - name: Clé de signature (secret facultatif)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Construire l'APK
        working-directory: site/android
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Renommer
        run: |
          cp site/android/app/build/outputs/apk/release/app-release.apk PriereEnLigne.apk
          ls -lh PriereEnLigne.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PriereEnLigne-apk
          path: PriereEnLigne.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Application Android 1.0.${{ github.run_number }}
          make_latest: true
          files: PriereEnLigne.apk
          body: |
            Application Android **Prière en Ligne** : le site, la Formation Héros de la foi et les Défis bibliques, utilisables hors connexion.

            **Installer** : téléchargez `PriereEnLigne.apk` sur votre téléphone Android, ouvrez-le, autorisez l'installation depuis cette source si Android le demande, puis touchez « Installer ».

            La connexion aux comptes (formation, équipes), les examens et l'audio de la Bible demandent Internet ; tout le reste fonctionne sans connexion.
